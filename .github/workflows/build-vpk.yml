name: Build Vita VPK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install vita2d
        run: vdpm libvita2d

      - name: Configure
        run: cmake -S . -B build

      - name: Build VPK
        run: cmake --build build --parallel

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaOverdrive-VPK
          path: build/VitaOverdrive.vpk
          if-no-files-found: error